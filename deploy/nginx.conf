server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json model/gltf-binary image/svg+xml;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /models/ {
    add_header Cache-Control "public, max-age=86400";
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
