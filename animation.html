<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大肥鱼 · 动作调试台</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #e8edf6; color: #273250; font: 13px/1.5 "PingFang SC", system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      #panel {
        position: fixed; left: 16px; top: 16px; bottom: 16px; width: 344px; overflow-y: auto;
        background: rgba(255, 255, 255, 0.94); border-radius: 16px; padding: 16px;
        box-shadow: 0 10px 40px rgba(35, 53, 83, 0.16); backdrop-filter: blur(8px);
      }
      #panel::-webkit-scrollbar { width: 8px; }
      #panel::-webkit-scrollbar-thumb { background: #cfd8ea; border-radius: 4px; }
      h1 { font-size: 17px; margin: 0 0 2px; }
      .sub { color: #7b869e; font-size: 11.5px; margin: 0 0 12px; }
      section { border-top: 1px solid #e6ebf5; padding-top: 10px; margin-top: 12px; }
      section:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
      h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8b96ac; margin: 0 0 8px; font-weight: 600; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
      button {
        border: 1px solid #dbe2f0; background: #fff; color: #34476c; border-radius: 8px;
        padding: 6px 10px; cursor: pointer; font: 12px/1.3 inherit; transition: background .12s, border-color .12s;
      }
      button:hover { background: #eef3ff; border-color: #c3d3f0; }
      button:active { transform: translateY(1px); }
      button.active { background: #3d62ad; border-color: #3d62ad; color: #fff; }
      button:disabled { opacity: .4; cursor: not-allowed; }
      .muted { color: #7b869e; }
      .hint { color: #8b96ac; font-size: 11px; margin: 4px 0 8px; }
      select { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid #dbe2f0; background: #fff; color: #34476c; font: 12px inherit; }
      input[type="range"] { width: 100%; accent-color: #3d62ad; }
      .slider-row { display: flex; align-items: center; gap: 8px; }
      .slider-row span { font-variant-numeric: tabular-nums; color: #5b6884; font-size: 11.5px; min-width: 78px; text-align: right; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-size: 12px; }
      dt { color: #8b96ac; }
      dd { margin: 0; font-variant-numeric: tabular-nums; }
      #log { margin: 6px 0 0; padding: 8px; background: #f4f7fd; border-radius: 8px; max-height: 104px; overflow-y: auto; font: 11px/1.6 ui-monospace, Menlo, monospace; color: #4b5872; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel">
      <h1>动作调试台</h1>
      <p class="sub">21 段烘焙片段 · 分层 / 钢盆互动 / 形态键</p>
      <div id="sections"></div>
    </div>
    <script type="module" src="/src/animationDemo.ts"></script>
  </body>
</html>
