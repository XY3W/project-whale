<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Whale · 鲸</title>
  </head>
  <body>
    <div id="app"></div>
    <aside class="left-dock" aria-label="场地功能">
      <div class="dock-heading"><span class="dock-mark">W</span><div><strong>鲸鱼娘的房间</strong><small>场地工具</small></div></div>
      <section class="dock-section" aria-label="游戏">
        <div class="dock-label">游戏 <span>PLAY</span></div>
        <div class="dock-grid"><button id="start-minesweeper" class="dock-action primary" type="button">扫雷开局</button><button id="start-gomoku" class="dock-action primary" type="button">五子棋开局</button><button id="start-xiangqi" class="dock-action primary" type="button">象棋开局</button></div>
        <p id="xiangqi-rule-note" class="xiangqi-rule-note" role="status" hidden></p>
      </section>
      <section class="dock-section" aria-label="道具">
        <div class="dock-label">道具 <span>PROPS</span></div>
        <div class="dock-grid"><button id="reset-basin" class="dock-action" type="button">重置盆</button><button id="reset-scoop" class="dock-action" type="button">重置勺</button></div>
      </section>
      <a class="dock-debug" href="/?debug">动作验收 <span aria-hidden="true">↗</span></a>
    </aside>
    <div id="loading">
      <div class="loading-inner">
        <div class="loading-title">Project Whale</div>
        <div class="loading-bar"><i></i></div>
        <div class="loading-note">正在载入角色…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <div class="side-picker" id="xiangqi-side" hidden>
      <div class="side-picker-card" role="dialog" aria-label="选择执色">
        <strong>这盘棋你执哪一方？</strong>
        <p>执红先行，执黑让她先走。</p>
        <div class="side-picker-actions">
          <button type="button" data-side="red">执红</button>
          <button type="button" data-side="black">执黑</button>
          <button type="button" data-side="cancel" class="ghost">取消</button>
        </div>
      </div>
    </div>
  </body>
</html>
