<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>象棋素材 · 动作验收</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111924;color:#edf2fa;font:15px system-ui}#view{position:fixed;inset:0 0 0 350px}aside{position:fixed;inset:0 auto 0 0;width:350px;padding:24px;overflow:auto;background:#182333;border-right:1px solid #35445a}h1{font-size:23px;margin:0 0 8px}p{line-height:1.6;color:#b7c5d8}button,select{font:inherit;color:#edf2fa;background:#2a3c56;border:1px solid #466082;border-radius:10px;padding:10px;margin:3px;cursor:pointer}button:hover{background:#385477}select{width:100%;margin:8px 0}input[type=range]{width:100%}.group{border-top:1px solid #35445a;margin-top:18px;padding-top:14px}label{display:block;margin:8px 0}#status{white-space:pre-wrap;line-height:1.7;color:#bfdef6}small{line-height:1.6;color:#9fb0c4}#caption{position:absolute;bottom:24px;left:24px;background:#152436df;padding:12px 18px;border-radius:14px;pointer-events:none}@media(max-width:700px){aside{width:100%;height:40%;inset:60% 0 0;padding:14px}#view{inset:0 0 40%}h1{font-size:18px}}</style>
<aside><h1>象棋素材 · 第一版</h1><p>棋子半径为格宽40%（直径80%），厚度加倍为0.2553m；整面地板为棋盘。双手水平夹托，棋子平稳飞入/飞出。可拖动旋转查看。此页不接入 LLM，也不运行棋规与寻路。</p><div id="status">正在载入角色和棋子…</div><div class="group"><button id="demo">完整搬棋</button><button id="safe">临时放下 / 再抱起</button><button id="capture">吃子放置</button><button id="pause">暂停</button><label>动作逐项检查<select id="clip"></select></label><input id="time" type="range" min="0" max="1" step=".001" value="0"><small id="timelabel"></small><label>时间（秒）<input id="seconds" type="number" min="0" step="0.01" value="0" style="width:100%;padding:8px;font:inherit"></label><button id="png">保存当前预览 PNG</button><button id="video">导出当前流程视频</button></div><div class="group" id="views"><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button><button data-view="quarter">斜侧</button><button data-view="hands">手部特写</button><button data-view="board">满盘 / 搬兵</button></div><div class="group"><label><input id="basin" type="checkbox">同时戴盆（检查装备兼容）</label><label><input id="blink" type="checkbox" checked>保留已合并的自然眨眼</label><small>本次保留原始模型。动作在副本中制作；新角色包只追加动作，原有网格、蒙皮、材质和 45 段动画保持不变。预览的服务器结算点按立即确认演示；正式接入必须暂停等待确认。</small></div></aside><main id="view"><div id="caption">素材预览</div></main><script type="module" src="/scripts/xiangqi/preview.js"></script></html>
